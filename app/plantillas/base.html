<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block titulo %}La Ceiba Datos{% endblock %}</title>
<link rel="stylesheet" href="/diseno/base.css?v={{ version_css }}">
<style>{% block estilos %}{% endblock %}</style>
</head><body>
<nav class="navegacion" aria-label="Principal"><div>
  <a class="marca" href="/" style="color:inherit;text-decoration:none">La Ceiba Datos</a>
  {% block segmentos %}{% endblock %}
  <div class="acciones">
    {% if admin %}
      <a href="/panel">Panel</a><a href="/admin">Administrar</a>
      <form method="post" action="/salir"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Salir</button></form>
    {% else %}
      <a href="/entrar">Entrar</a>
    {% endif %}
  </div>
</div></nav>
<main>{% block contenido %}{% endblock %}</main>
</body></html>
